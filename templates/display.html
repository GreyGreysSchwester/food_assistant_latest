body{

*{

body::before{

    height:100%;

.header{

.container{

.page{

.page.active{

.option{

input[type=text]{

button{
    margin-top:20px;

button:hover{

.result-box{

    background:rgba(255,255,255,.92);

.thinking-box{

}
@keyframes dots{
    0%{content:'';}
    50%{content:'.';}

}

#nutritionChart{
    width:100%;
    height:420px;

/* 蔬菜区域 */
#veggie-world{
    position:fixed;
    bottom:0;
    left:0;

    width:100%;
    height:203px;

    overflow:hidden;

    pointer-events:none;

    z-index:5;
}

/* 单个蔬菜 */
.veggie{
    position:absolute;
    font-size:40px;
    user-select:none;
}

/* 摇一摇按钮 */
#shakeBtn{
    position: absolute;

    right:20px;
    bottom:40px;

    z-index:999;

    border:none;

    padding:12px 12px;

    border-radius:50px;

    cursor:pointer;

    background:#fff1d16e;
    color:white;
    font-size:33px;
}

/* 包裹容器 */
.shake-wrapper{
    position:fixed;
    right:30px;
    bottom:30px;
    z-index:9999;
}

/* 提示文字 */
.shake-tip{
    position:absolute;

    right:85px;
    top:50%;

    transform:
        translateY(-50%)
        translateX(10px);

    white-space:nowrap;

    background:rgba(50,50,50,0.9);

    color:white;

    padding:8px 12px;

    border-radius:12px;

    font-size:14px;

    opacity:0;

    pointer-events:none;

    transition:all .3s ease;
}

/* 小三角 */
.shake-tip::after{
    content:"";

    position:absolute;

    right:-6px;
    top:50%;

    transform:translateY(-50%);

    border-left:6px solid rgba(50,50,50,0.9);
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
}

/* 鼠标悬停显示 */
.shake-wrapper:hover .shake-tip{

    opacity:1;

    transform:
        translateY(-50%)
        translateX(0);
}

html,
body {

body {

.template-screen {

}

.template-screen::before {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  content: "";

    radial-gradient(circle at 8% 34%, rgba(255, 226, 122, 0.86) 0 1px, transparent 2px),

.top-nav {

.brand-logo {

.status-dot {

.status-divider {
  color: rgba(242, 215, 122, 0.78);
}

.result-layout {
  position: relative;
  overflow: visible;
  min-height: calc(100svh - 96px);
  padding: 0 56px 56px;
}

.agent-stage {
  position: absolute;
  top: 40px;
  left: 200px;
  right: 240px;
  bottom: 40px;
  overflow-y: auto;
  overflow-x: hidden;

.qr-dock {

  right: 56px;
  bottom: 56px;

  align-items: flex-end;
  gap: 24px;
  max-width: calc(100vw - 48px);
}

.qr-tags {
  display: grid;
  gap: 11px;

  padding-bottom: 6px;
  color: #666;
  font-size: 1.08rem;
  font-weight: 800;
  text-shadow: 0 0 14px rgba(242, 215, 122, 0.24);
}

.qr-card {
  position: relative;
  display: grid;
  width: 154px;
  height: 154px;
  place-items: center;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 8px;
  color: rgba(18, 18, 24, 0.4);
  background:
    linear-gradient(#111 0 0) 24px 24px / 26px 26px no-repeat,
    linear-gradient(#111 0 0) calc(100% - 50px) 24px / 26px 26px no-repeat,
    linear-gradient(#111 0 0) 24px calc(100% - 50px) / 26px 26px no-repeat,

    #fff;
  box-shadow: 0 20px 44px rgba(0, 0, 0, 0.28);
}

.qr-card span {
  position: relative;
  z-index: 1;
  display: inline-grid;
  width: 46px;
  height: 46px;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.78);
  font-weight: 800;
}

function showDisplayPage(id){

    document
        .querySelectorAll(".display-page")
        .forEach(p=>p.classList.remove("active"));

    document
        .getElementById(id)
        .classList.add("active");
}

async function generateRecipe(){

    const taste =
        document.querySelector(
            'input[name="taste"]:checked'
        )?.value || '';

    const avoid =
        document.getElementById(
            'avoid'
        ).value || '无';

    const allergy =
        document.getElementById(
            'allergy'
        ).value || '无';

    const goal =
        document.querySelector(
            'input[name="goal"]:checked'
        )?.value || '';

    const prompt =
        `偏好口味:${taste}；忌口:${avoid}；过敏原:${allergy}；健康目标:${goal}。请先生成食谱推荐，并单独给出营养分析。`;

    // 立即进入加载页
    nextPage(5);

    document.getElementById(
        'recipeLoading'
    ).style.display = 'block';

    document.getElementById(
        'recipeResult'
    ).style.display = 'none';

    document.getElementById(
        'nextBtn'
    ).style.display = 'none';

    try{

        const response =
            await fetch(
                '/api/chat',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        message:prompt
                    })
                }
            );

        const data =
            await response.json();

        const txt =
            data.response || '';

        console.log('data response：');
        console.log(txt);

        const parts =
            txt.split(/营养分析[:：]/);

        recipeText =
            parts[0] || txt;

        nutritionText =
            parts.length > 1
                ? ('营养分析：'+parts[1])
                : '未检测到营养分析内容';

        // 隐藏视频
        document.getElementById(
            'recipeLoading'
        ).style.display = 'none';

        // 显示结果
        document.getElementById(
            'recipeResult'
        ).style.display = 'block';

        document.getElementById(
            'nextBtn'
        ).style.display = 'inline-block';

        document.getElementById(
            'recipeResult'
        ).innerHTML =
            marked.parse(recipeText);



    }
    catch(e){

        document.getElementById(
            'recipeLoading'
        ).style.display = 'none';

        document.getElementById(
            'recipeResult'
        ).style.display = 'block';

        document.getElementById(
            'recipeResult'
        ).innerHTML =
            '生成失败';
    }
}

async function loadNutrition(){

    try{

        const loading =
            document.getElementById(
                'nutritionLoading'
            );

        const result =
            document.getElementById(
                'nutritionResult'
            );

function renderNutritionCompareChart(
    protein,
    fat,
    carb,
    fiber
){

    const chart = echarts.init(
        document.getElementById(
            'nutritionCompareChart'
        )
    );

    const currentData = [
        protein,
        fat,
        carb,
        fiber
    ];

    const recommendData = [
        25,
        20,
        75,
        10
    ];

    const names = [
        '蛋白质',
        '脂肪',
        '碳水',
        '膳食纤维'
    ];

    const option = {

        title:{
            text:'当前菜谱与推荐摄入对比',
            left:'center'
        },

        tooltip:{

            trigger:'axis',

            axisPointer:{
                type:'shadow'
            },

            formatter:function(params){

                const index =
                    params[0].dataIndex;

                const current =
                    currentData[index];

                const recommend =
                    recommendData[index];

                const diff =
                    current - recommend;

                return `
                    <b>${names[index]}</b><br/>
                    当前菜谱：${current.toFixed(1)}g<br/>
                    推荐摄入：${recommend.toFixed(1)}g<br/>
                    差值：${diff>0?'+':''}${diff.toFixed(1)}g
                `;
            }
        },

        legend:{
            bottom:10,
            selectedMode:false
        },

        xAxis:{
            type:'category',
            data:names
        },

        yAxis:{
            type:'value',
            name:'克(g)'
        },

        series:[
            {
                name:'当前菜谱',
                type:'bar',
                data:currentData
            },
            {
                name:'推荐摄入',
                type:'bar',
                data:recommendData
            }
        ]
    };

    chart.setOption(option);

    window.addEventListener(
        'resize',
        ()=>chart.resize()
    );
}

function extractNutrition(text){

    const nutritionPart =
        text.split("### ⭐")[0];

    console.log("营养区块：");
    console.log(nutritionPart);

    console.log("原始营养分析：");
    console.log(text);

    return {

        kcal:Number(
    nutritionPart.match(/热量.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"calories"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/calories.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
protein:Number(
    nutritionPart.match(/蛋白质.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"protein"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/protein.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
carb:Number(
    nutritionPart.match(/碳水化合物.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"carbs"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/carbs.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
fat:Number(
    nutritionPart.match(/脂肪.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"fat"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/fat.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
),
fiber:Number(
    nutritionPart.match(/膳食纤维.*?(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/"fiber"\s*:\s*(\d+(?:\.\d+)?)/)?.[1]
    ||
    nutritionPart.match(/fiber.*?(\d+(?:\.\d+)?)/i)?.[1]
    ||
    0
)
    };

}

/*Matter.js 蔬菜重力系统*/
// 所有蔬菜物理体
let veggieBodies = [];

// Matter引擎
let engine;

// Matter世界
let world;

/*页面加载完成后启动*/
window.addEventListener("load", () => {

    initVeggieWorld();

});


/*初始化蔬菜世界*/
function initVeggieWorld(){

    // Matter模块
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;

    // 创建引擎
    engine = Engine.create();

    world = engine.world;

    // 创建渲染器
    const render = Render.create({

        element: document.getElementById("veggie-world"),

        engine: engine,

        options: {
            width: window.innerWidth,
            height: 220,
            wireframes: false,
            background: "transparent"
        }
    });

    // 启动渲染
    Render.run(render);

    // 启动物理计算
    const runner = Runner.create();

    Runner.run(runner, engine);

    /*创建地板*/
    const ground = Bodies.rectangle(
        window.innerWidth / 2,
        223,
        window.innerWidth,
        40,
        {
            isStatic: true
        }
    );

    Composite.add(world, ground);

    /*创建左右墙壁*/
    const leftWall = Bodies.rectangle(
        -20,
        110,
        40,
        220,
        {
            isStatic: true
        }
    );

    const rightWall = Bodies.rectangle(
        window.innerWidth + 20,
        110,
        40,
        220,
        {
            isStatic: true
        }
    );

    Composite.add(world, [leftWall, rightWall]);

    /*蔬菜种类*/
    const veggies = [
        "🥕",
        "🥦",
        "🍅",
        "🥔",
        "🥑",
        "🥬",
        "🧅",
        "🍆",
        "🍐",
        "🍠",
        "🍋",
        "🍊",
        "🍇",
        "🍈",
        "🍉", 
        "🧀",
        "🥥",
        "🥝",
        "🌶️",
        "🦐",
        "🍗",
        "🥩",
        "🥚",
        "🥖",
        "🥯"
    ];

    /*生成35个蔬菜*/
    for(let i=0;i<35;i++){

        const emoji =
            veggies[
                Math.floor(
                    Math.random()*veggies.length
                )
            ];

        createVeggie(emoji);
    }

    /*摇一摇按钮*/
    document
        .getElementById("shakeBtn")
        .addEventListener("click", shakeVeggies);
}


/*创建一个蔬菜*/
function createVeggie(emoji){

    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;

    // 创建DOM
    const div = document.createElement("div");

    div.className = "veggie";

    div.innerHTML = emoji;

    document
        .getElementById("veggie-world")
        .appendChild(div);

    // 创建物理体
    const body = Bodies.circle(

        Math.random() * window.innerWidth,

        -100 - Math.random() * 500,

        35,

        {
            restitution: 0.7,
            friction: 0.05,

            render: {
                fillStyle: "transparent",
                strokeStyle: "transparent",
                lineWidth: 0
            }
        }
    );

    // 添加到世界
    Composite.add(world, body);

    // 保存
    veggieBodies.push({
        body: body,
        element: div
    });

    /*每一帧同步位置*/
    Matter.Events.on(
        engine,
        "afterUpdate",
        () => {

            div.style.left =
                (body.position.x - 18) + "px";

            div.style.top =
                (body.position.y - 18) + "px";

            div.style.transform =
                `rotate(${body.angle}rad)`;
        }
    );
}


/* 摇一摇*/
function shakeVeggies(){

    veggieBodies.forEach(item => {

        Matter.Body.applyForce(

            item.body,

            item.body.position,

            {
                x:(Math.random()-0.5)*0.05,
                y:-0.08
            }
        );

    });

}

async function handleState(state){

    const res = await fetch('/api/display_data');
    const data = await res.json();

    console.log("📦 B屏数据:", data);

switch(state){

    case "waiting":

        showDisplayPage("displayWaiting");
        break;

    case "recipe_loading":

        showDisplayPage("page5");

        document.getElementById("recipeLoading").style.display="block";
        document.getElementById("recipeResult").style.display="none";

        break;

    case "recipe_result":

        showDisplayPage("page5");

        document.getElementById("recipeLoading").style.display="none";
        document.getElementById("recipeResult").style.display="block";

        document.getElementById("recipeResult").innerHTML =
            marked.parse(data.recipe || "暂无数据");

        break;

    case "nutrition_loading":

        showDisplayPage("page6");

        document.getElementById("nutritionLoading").style.display="block";
        document.getElementById("nutritionResult").style.display="none";

        break;

    case "nutrition_result":

        showDisplayPage("page6");

        document.getElementById("nutritionLoading").style.display="none";
        document.getElementById("nutritionResult").style.display="block";

        document.getElementById("nutritionText").innerHTML =
            marked.parse(data.nutrition || "");

        const nutrition = extractNutrition(data.nutrition || "");

        renderNutritionChart(
            nutrition.protein,
            nutrition.fat,
            nutrition.carb,
            nutrition.fiber,
            nutrition.kcal
        );

        renderNutritionCompareChart(
            nutrition.protein,
            nutrition.fat,
            nutrition.carb,
            nutrition.fiber
        );

        break;

    case "show_qrcode":

        showDisplayPage("page7");

        const qr = document.getElementById("qrcode");

        qr.innerHTML = "";

        new QRCode(qr,{
            text:data.url,
            width:400,
            height:400
        });

        break;
}

}
